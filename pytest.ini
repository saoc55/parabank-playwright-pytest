[pytest]
testpaths = tests
pythonpath = .

# page.goto("/parabank/...") is resolved against this
base_url = https://parabank.parasoft.com

addopts =
    # each test runs once per browser
    --browser chromium
    --browser firefox
    # failure artifacts land in test-results/
    --screenshot only-on-failure
    --video retain-on-failure
    --tracing retain-on-failure
    # retry once
    --reruns 1
    # parallel workers
    -n 2
    # per test timeout (seconds)
    --timeout 30
    # reporting
    -v
    --alluredir allure-results
    --html playwright-report/report.html
    --self-contained-html
